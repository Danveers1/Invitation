<!-- ============================================================
     CINEMATIC WEDDING OPENING
     ============================================================ -->
<section class="wedding-opening" id="weddingOpening">

  <!-- Ambient background -->
  <div class="opening-bg"></div>

  <!-- Floating petals -->
  <div class="opening-petals" id="openingPetals"></div>

  <!-- Top branding -->
  <div class="opening-brand">
    <div class="opening-khanda">ੴ</div>

    <div class="monogram">
      D <span>♡</span> H
    </div>

    <div class="opening-subtitle">
      OUR FOREVER BEGINS...
    </div>
  </div>

  <!-- ========================================================
       COUPLE
       ======================================================== -->
  <div class="animated-couple">

    <div class="couple-glow"></div>

    <div class="groom-character">
      <img
        src="assets/groom-wedding.png"
        alt="Danveer Singh"
      >
    </div>

    <div class="bride-character">
      <img
        src="assets/bride-wedding.png"
        alt="Harman Preet Kaur"
      >
    </div>

  </div>


  <!-- ========================================================
       OPENING GATES
       ======================================================== -->
  <div class="gate gate-left">
    <div class="gate-inner">
      <div class="gate-khanda">☬</div>
      <div class="gate-floral">❧</div>
    </div>
  </div>

  <div class="gate gate-right">
    <div class="gate-inner">
      <div class="gate-khanda">☬</div>
      <div class="gate-floral">❧</div>
    </div>
  </div>


  <!-- ========================================================
       OPEN BUTTON
       ======================================================== -->
  <button
    class="open-wedding"
    id="openInvitation"
    type="button"
  >

    <span class="open-wedding-small">
      YOU ARE INVITED
    </span>

    <span class="open-wedding-main">
      Tap to Open
    </span>

    <span class="open-hand">☝</span>

    <span class="open-shimmer"></span>

  </button>


  <!-- ========================================================
       SCRATCH REVEAL
       ======================================================== -->
  <div class="scratch-screen" id="scratchScreen">

    <div class="scratch-content">

      <p class="scratch-kicker">
        A SPECIAL DATE
      </p>

      <h2>
        Scratch the Heart
      </h2>

      <p class="scratch-instruction">
        ✦ Reveal the day our forever begins ✦
      </p>


      <div
        class="scratch-heart"
        id="scratchHeart"
      >

        <!-- Revealed information -->
        <div class="heart-reveal">

          <span class="heart-date">
            23 – 25
          </span>

          <span class="heart-month">
            OCTOBER
          </span>

          <span class="heart-year">
            2026
          </span>

          <span class="heart-city">
            AMRITSAR
          </span>

        </div>

        <!-- Scratch surface -->
        <canvas
          id="scratchCanvas"
        ></canvas>

      </div>


      <div class="scratch-names">
        Danveer <span>&amp;</span> Harman Preet
      </div>

      <div class="scratch-tagline">
        A JOURNEY OF TWO SOULS, ONE DESTINY
      </div>

      <button
        class="continue-button"
        id="continueInvitation"
        type="button"
      >
        Enter Our Wedding
        <span>→</span>
      </button>

    </div>

  </div>

</section>
